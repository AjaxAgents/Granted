<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0133A2">
  <meta name="color-scheme" content="light">
  <meta name="description" content="Granted: delivery booking and gate access for Ajax Building Company jobsites.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' %VITE_CONNECT_SRC%; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="no-referrer">
  <link rel="icon" type="image/png" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./apple-touch-icon-180.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <title>Granted</title>
  <script src="./boot-check.js"></script>
  <style>
    body { margin: 0; background: #E6EAEF; }
    .splash { position: fixed; inset: 0; background: #0133A2; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; z-index: 50; transition: opacity .35s ease; }
    .splash img { width: min(56vw, 240px); height: auto; }
    .splash .nm { color: #fff; font: 600 15px "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif; letter-spacing: .5em; text-indent: .5em; opacity: .9; }
    .splash .bar { width: 120px; height: 3px; border-radius: 3px; background: rgba(255,255,255,.22); overflow: hidden; }
    .splash .bar span { display: block; width: 40%; height: 100%; background: #fff; border-radius: 3px; animation: load 1.1s ease-in-out infinite; }
    .splash.out { opacity: 0; pointer-events: none; }
    @keyframes load { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }
    @media (prefers-reduced-motion: reduce) { .splash .bar span { animation: none; } }
  </style>
</head>
<body>
  <div class="splash" id="splash" role="img" aria-label="Granted is loading"><img src="/src/assets/logo-white-400.png" alt="Ajax"><div class="nm">GRANTED</div><div class="bar"><span></span></div></div>
  <div id="root"></div>
  <noscript>Granted needs JavaScript turned on.</noscript>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
