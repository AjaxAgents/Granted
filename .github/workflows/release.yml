# Publishes the ready-made Azure package (granted-azure.zip) that setup/azure-setup.sh downloads:
#   https://github.com/<owner>/<repo>/releases/latest/download/granted-azure.zip
# Runs when a version tag (v1.2.3) is pushed, or by hand from the Actions tab (give a version).
name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version: { description: 'Version to publish, e.g. v1.0.1', required: true }
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: bash setup/package-azure.sh "$PWD/granted-azure.zip"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" granted-azure.zip --clobber
          else
            gh release create "$VERSION" granted-azure.zip --target "$GITHUB_SHA" --title "Granted $VERSION" \
              --notes "Azure package for setup/azure-setup.sh (the API and the web app in one Function App, with database migrations). See docs/operations.md."
          fi
