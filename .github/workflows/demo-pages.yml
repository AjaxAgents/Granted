# Publishes the proof of concept (the full app on demo data, no server) to GitHub Pages:
#   https://ajaxagents.github.io/Granted/
# Runs on every push to main, or by hand from the Actions tab.
name: Proof of concept on GitHub Pages
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build -w apps/web
        env:
          # Optional: a repository secret holding the hash of a demo-only admin set-up code.
          VITE_DEMO_ADMIN_CODE_HASH: ${{ secrets.DEMO_ADMIN_CODE_HASH }}
      - uses: actions/upload-pages-artifact@v5
        with: { path: apps/web/dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
