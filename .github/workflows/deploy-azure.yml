# Updates an existing Azure installation from GitHub (after setup/azure-setup.sh has run once).
# Started by hand from the Actions tab. Uses OpenID Connect: no Azure passwords are stored in GitHub.
# Needs repository variables AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID and
# APP_NAME (the Function App's name, printed by the set-up script). See docs/operations.md.
name: Deploy to Azure
on:
  workflow_dispatch:
    inputs:
      environment: { description: 'pilot or prod', required: true, default: pilot }
permissions:
  contents: read
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: bash setup/package-azure.sh "$PWD/granted-azure.zip"
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: Azure/functions-action@v1
        with:
          app-name: ${{ vars.APP_NAME }}
          package: granted-azure.zip
